<html>
    <head>
        <style>
            body{
                background: orangered;
                width: 100%;
                height: 100vh;
                display:flex;
                align-items: center;
                justify-content:center;
            }
            form{
                width: 250px;
                height: 170px;
                background-color: lightgrey;
                border-radius: 10px;
                padding: 30px;
            }
            .else{
                text-size-adjust: 0.1;
            }
        </style>
    </head>
    <body>
        <form onsubmit="myfunc(event)">
            <label>User Name</label>
            <input type="text" name="user" id="user" size="15"><br><br>
            <label>Email</label>
            <input type="email" id="email" name="email" required><br><br>
            <label>Password</label>
            <input type="password" id="password" name="password" required><br><br>
            <input type="submit"><br><br>
            <div class="else">
                <a href="signup.html">Click here to sign up</a>
            </div>
            
        </form>
        <script>
            function myfunc(event){
                event.preventDefault();
                var uname=document.getElementById("user").value;
                var email=document.getElementById("email").value;
                var pwd=document.getElementById("password").value;
                //localStorage.setItem(email,pwd);
                c=window.localStorage.getItem(email).split(",");
                if (c==null){
                    alert("Email not found");
                }
                else{
                    if (c[2]==pwd){
                        //document.write('<html><body><img src="Profpic.png" align="right"></body></html>');//go to webpage
                        window.localStorage.setItem("current",c);
                        window.open("Loggedin.html");
                        window.close("signin.html");
                    }
                    else{
                        alert("Wrong password");
                    }
                }
            }
        </script>

    </body>
</html>
